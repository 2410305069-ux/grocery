          id: "ice-1",
          name: "Vanilla Bean Tub",
          nameHindi: "वैनिला बीन टब",
          price: 6.50,
          priceInr: 120,
          weight: "500ml",
          image: PRODUCTS[8].image,
          quantity: 1
        }
      ]);
      const [toastMessage, setToastMessage] = useState(null);
      const [discountPercent, setDiscountPercent] = useState(0);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 2500);
      };

      const addToCart = (product) => {
        setCartItems((prev) => {
          const exists = prev.find((item) => item.id === product.id);
          if (exists) {
            showToast(`Added another ${product.name}`);
            return prev.map((item) =>
              item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item
            );
          }
          showToast(`Added ${product.name} to cart`);
          return [...prev, { ...product, quantity: 1 }];
        });
      };

      const updateQuantity = (id, delta) => {
        setCartItems((prev) =>
          prev
            .map((item) =>
              item.id === id ? { ...item, quantity: item.quantity + delta } : item
            )
            .filter((item) => item.quantity > 0)
        );
      };

      const removeFromCart = (id) => {
        setCartItems((prev) => prev.filter((item) => item.id !== id));
        showToast("Item removed");
      };

      const applyCoupon = (code) => {
        if (code.toUpperCase() === "VERDANT20" || code.toUpperCase() === "PURE20") {
          setDiscountPercent(20);
          showToast("Coupon Applied: 20% OFF!");
          return { success: true, message: "Coupon applied! 20% off." };
        }
        showToast("Invalid promo code");
        return { success: false, message: "Invalid coupon code. Try VERDANT20" };
      };

      const totalItemsCount = cartItems.reduce((acc, item) => acc + item.quantity, 0);
      const subtotalInr = cartItems.reduce((acc, item) => acc + item.priceInr * item.quantity, 0);
      const deliveryFeeInr = subtotalInr > 200 || subtotalInr === 0 ? 0 : 40;
      const taxesInr = subtotalInr > 0 ? 15 : 0;
      const discountAmountInr = Math.round((subtotalInr * discountPercent) / 100);
      const grandTotalInr = subtotalInr - discountAmountInr + deliveryFeeInr + taxesInr;

      return (
        <CartContext.Provider
          value={{
            cartItems,
            totalItemsCount,
            subtotalInr,
            deliveryFeeInr,
            taxesInr,
            discountPercent,
            discountAmountInr,
            grandTotalInr,
            toastMessage,
            addToCart,
            updateQuantity,
            removeFromCart,
            applyCoupon,
            clearCart: () => setCartItems([])
          }}
        >
          {children}
        </CartContext.Provider>
      );
    };

                {orderDone ? (
                  <div className="text-center py-16 flex flex-col items-center gap-3">
                    <span className="material-symbols-outlined text-6xl text-primary">verified</span>
                    <h2 className="text-2xl font-bold">Order Placed Successfully!</h2>
                    <p className="text-xs text-on-surface-variant">Your order will arrive in 25-30 minutes.</p>
                    <button onClick={() => { clearCart(); setOrderDone(false); handleNav("landing"); }} className="bg-primary text-on-primary px-6 py-2.5 rounded-full text-xs font-bold mt-3">Back to Store</button>
                  </div>
                ) : (
                  <>
                    <h1 className="font-headline-md text-2xl font-bold text-primary">My Cart / मेरी टोकरी ({cartItems.length})</h1>
                    <div className="flex flex-col gap-3">
                      {cartItems.map(item => (
                        <div key={item.id} className="flex items-center gap-3 bg-surface-container-lowest p-3 rounded-xl border border-outline-variant/60">
                          <img src={item.image} className="w-16 h-16 object-contain mix-blend-multiply" />
                          <div className="flex-1">
                            <h3 className="text-xs font-bold">{item.name}</h3>
                            <p className="text-[11px] text-on-surface-variant">{item.nameHindi} • {item.weight}</p>
                            <span className="text-xs font-bold text-primary">₹{item.priceInr}</span>
                          </div>
                          <div className="flex items-center gap-2">
                            <button onClick={() => updateQuantity(item.id, -1)} className="w-6 h-6 rounded-full bg-surface-container flex items-center justify-center text-xs">-</button>
                            <span className="text-xs font-bold">{item.quantity}</span>
                            <button onClick={() => updateQuantity(item.id, 1)} className="w-6 h-6 rounded-full bg-secondary text-on-secondary flex items-center justify-center text-xs">+</button>
                            <button onClick={() => removeFromCart(item.id)} className="text-error ml-2 text-xs">✕</button>
                          </div>
                        </div>
                      ))}
                    </div>

                    {/* Coupon Box */}
                    <div className="bg-surface-container-lowest p-4 rounded-xl border border-outline-variant/60 flex gap-2">
                      <input type="text" value={couponInput} onChange={(e) => setCouponInput(e.target.value)} placeholder="Enter code 'VERDANT20'" className="flex-1 bg-surface-container-low border border-outline-variant rounded-full px-4 text-xs h-10 outline-none" />
                      <button onClick={() => applyCoupon(couponInput)} className="bg-secondary-container text-on-secondary-container px-4 rounded-full text-xs font-bold">Apply</button>
                    </div>

                    {/* Bill Summary */}
                    <div className="bg-surface-container-lowest p-4 rounded-xl border border-outline-variant/60 flex flex-col gap-2 text-xs">
                      <div className="flex justify-between"><span>Item Total</span><span>₹{subtotalInr}</span></div>
                      {discountPercent > 0 && <div className="flex justify-between text-primary font-bold"><span>Discount (20%)</span><span>-₹{discountAmountInr}</span></div>}
                      <div className="flex justify-between"><span>Delivery Fee</span><span>{deliveryFeeInr === 0 ? "FREE" : "₹40"}</span></div>
                      <div className="flex justify-between"><span>Taxes</span><span>₹{taxesInr}</span></div>
                      <div className="border-t pt-2 flex justify-between font-bold text-base text-primary"><span>Grand Total</span><span>₹{grandTotalInr}</span></div>
                    </div>

                    <button onClick={() => setOrderDone(true)} className="w-full bg-primary text-on-primary py-3.5 rounded-full font-bold text-sm shadow-md">Proceed to Checkout • ₹{grandTotalInr}</button>
                  </>
                )}
              </div>
            )}
          </main>

          {/* Bottom Bar */}
          <nav className="fixed bottom-0 left-0 w-full z-50 md:hidden bg-surface/95 backdrop-blur-md border-t border-outline-variant/30 flex justify-around py-2">
            <button onClick={() => handleNav("home")} className={`text-xs flex flex-col items-center ${activePage === "home" ? "text-primary font-bold" : "text-on-surface-variant"}`}>
              <span className="material-symbols-outlined">home</span>
              <span>Home</span>
            </button>
            <button onClick={() => handleNav("landing")} className={`text-xs flex flex-col items-center ${activePage === "landing" ? "text-primary font-bold" : "text-on-surface-variant"}`}>
              <span className="material-symbols-outlined">storefront</span>
              <span>Store</span>
            </button>
            <button onClick={() => handleNav("catalog")} className={`text-xs flex flex-col items-center ${activePage === "catalog" ? "text-primary font-bold" : "text-on-surface-variant"}`}>
              <span className="material-symbols-outlined">grid_view</span>
              <span>Catalog</span>
            </button>
            <button onClick={() => handleNav("cart")} className={`text-xs flex flex-col items-center relative ${activePage === "cart" ? "text-primary font-bold" : "text-on-surface-variant"}`}>
              <span className="material-symbols-outlined">shopping_cart</span>
              <span>Cart ({totalItemsCount})</span>
            </button>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(
      <CartProvider>
        <App />
      </CartProvider>
    );
  </script>
</body>
</html>
